name: Équité

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths: ["public/js/game/**", "public/js/shared/palette.js", "test/fairness.mjs", "test/chemin.mjs", "test/equilibrage/jeu.mjs", "test/equilibrage/invariants.mjs"]
  workflow_dispatch:

concurrency:
  group: equite
  cancel-in-progress: true

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Robot d'équité (0 mort attendu)
        run: npm run equite
      - name: Règles du jeu toujours tenues (invariants)
        run: node test/equilibrage/invariants.mjs 10 60
