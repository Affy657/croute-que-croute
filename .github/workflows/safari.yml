name: Safari

on:
  workflow_dispatch:

concurrency:
  group: safari
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      playwright: ${{ steps.lu.outputs.playwright }}
    steps:
      - uses: actions/checkout@v7
      - id: lu
        run: echo "playwright=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

  webkit:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright:v${{ needs.version.outputs.playwright }}-noble
    env:
      WRANGLER_SEND_METRICS: "false"
      NAVIGATEUR: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Clé admin de test
        run: node -e "console.log('ADMIN_KEY=' + require('crypto').randomBytes(24).toString('hex'))" > .dev.vars
      - name: Test de bout en bout dans Safari (WebKit, profil iPhone)
        run: npm run test:navigateur
