name: Tests

on:
  push:
    branches: [master]
    paths-ignore: ["README.md", "affiches/**", "maquettes/**", "qr/**", "public/music/**", "public/sfx/**", "public/icons/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npm run check
      - name: Tests unitaires
        run: npm run test:unit
      - name: Clé admin de test
        run: echo "ADMIN_KEY=$(openssl rand -hex 24)" > .dev.vars
      - name: Tests de l'API
        run: npm run test:api
