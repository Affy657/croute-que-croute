<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0b24">
<title>Couverts Volants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bungee&family=Chivo+Mono:wght@800&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="cv" aria-label="Zone de jeu"></canvas>

<div id="hud" hidden>
  <div id="time">0,00</div>
  <div id="hudBest"></div>
</div>

<section id="menu" class="screen">
  <div class="block">
    <p class="eyebrow">Collectif Tartine Sauvage</p>
    <h1>Couverts Volants</h1>
    <p class="how">Glisse ton doigt n'importe où, la tartine suit. Esquive les couverts le plus longtemps possible.</p>
  </div>
  <div class="block">
    <p id="menuInfo" class="info" hidden></p>
    <form id="joinForm" class="join" hidden>
      <label for="pseudo">Ton pseudo pour le classement</label>
      <input id="pseudo" name="pseudo" maxlength="16" autocomplete="nickname" autocapitalize="off" spellcheck="false" required>
      <p id="joinError" class="error" hidden></p>
      <button class="cta" type="submit">C'est parti</button>
    </form>
    <div id="menuActions" class="actions">
      <button id="play" class="cta" type="button">Jouer</button>
      <button id="menuBoard" class="ghost" type="button" hidden>Classement</button>
    </div>
    <p id="menuCountdown" class="countdown" hidden></p>
  </div>
</section>

<section id="over" class="screen veil" hidden>
  <div class="block">
    <h2>Tartinée&nbsp;!</h2>
    <p class="score"><span id="final">0,00</span><small>&nbsp;s</small></p>
    <p id="newBest" class="badge" hidden>Nouveau record</p>
    <p id="overBest" class="record" hidden></p>
    <p id="overRank" class="rank" hidden></p>
  </div>
  <div class="block">
    <div class="actions">
      <button id="again" class="cta" type="button">Rejouer</button>
      <button id="overBoard" class="ghost" type="button" hidden>Classement</button>
    </div>
    <p id="overCountdown" class="countdown" hidden></p>
  </div>
</section>

<section id="board" class="screen board" hidden>
  <div class="board-head">
    <h2>Classement</h2>
    <p id="boardEvent" class="eyebrow"></p>
    <p id="boardCountdown" class="countdown" hidden></p>
  </div>
  <ol id="boardList" class="board-list"></ol>
  <p id="boardEmpty" class="info" hidden></p>
  <button id="boardBack" class="cta" type="button">Retour</button>
</section>

<script type="module" src="/app.js"></script>
</body>
</html>
