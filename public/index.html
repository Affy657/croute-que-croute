<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0b24">
<title>Croûte que Croûte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="cv" aria-label="Zone de jeu"></canvas>

<div id="hud" hidden>
  <div id="time" class="digits">0,00</div>
  <div id="hudBest"></div>
</div>

<section id="menu" class="screen">
  <div class="block">
    <p class="eyebrow">Collectif Tartine Sauvage</p>
    <h1>Croûte que Croûte</h1>
  </div>
  <div class="block">
    <div id="menuStats" class="stats" hidden>
      <p id="menuBestBox" class="stat"><span class="stat-label">Record</span><span id="menuBest" class="stat-value digits"></span></p>
      <p id="menuRankBox" class="stat"><span class="stat-label">Place</span><span id="menuRank" class="stat-value hot"></span></p>
    </div>
    <p id="menuInfo" class="info" hidden></p>
    <form id="joinForm" class="join" hidden>
      <label for="pseudo" class="sr-only">Ton pseudo</label>
      <input id="pseudo" name="pseudo" maxlength="16" placeholder="Ton pseudo" autocomplete="nickname" autocapitalize="off" spellcheck="false" required>
      <p id="joinError" class="note error" hidden></p>
      <button class="cta" type="submit">C'est parti</button>
    </form>
    <div id="menuActions" class="actions">
      <button id="play" class="cta" type="button">Jouer</button>
      <button id="menuBoard" class="ghost" type="button" hidden>Classement</button>
    </div>
    <p id="menuCountdown" class="countdown" hidden></p>
  </div>
</section>

<section id="over" class="screen veil" hidden>
  <div class="block">
    <h2>Tartinée&nbsp;!</h2>
    <p class="score"><span id="final" class="digits">0,00</span><small>s</small></p>
    <p id="newBest" class="badge" hidden>Nouveau record</p>
    <div id="overStats" class="stats" hidden>
      <p id="overBestBox" class="stat"><span class="stat-label">Record</span><span id="overBest" class="stat-value digits"></span></p>
      <p id="overRankBox" class="stat"><span class="stat-label">Place</span><span id="overRank" class="stat-value hot"></span></p>
    </div>
    <p id="overNote" class="note" hidden></p>
  </div>
  <div class="actions">
    <button id="again" class="cta" type="button">Rejouer</button>
    <button id="overBoard" class="ghost" type="button" hidden>Classement</button>
  </div>
</section>

<section id="board" class="screen board" hidden>
  <div class="board-head">
    <h2>Classement</h2>
    <p id="boardEvent" class="eyebrow"></p>
    <p id="boardCountdown" class="countdown" hidden></p>
  </div>
  <ol id="boardList" class="board-list"></ol>
  <p id="boardEmpty" class="note" hidden></p>
  <button id="boardBack" class="cta" type="button">Retour</button>
</section>

<script type="module" src="/app.js"></script>
</body>
</html>
