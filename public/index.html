<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0b24">
<title>Croûte que Croûte</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Croûte">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/catalog.css">
</head>
<body>
<canvas id="cv" aria-label="Zone de jeu"></canvas>

<div id="hud" hidden>
  <div id="time" class="digits">0,00</div>
  <div id="hudBest"></div>
</div>

<section id="menu" class="screen">
  <div class="block">
    <p id="brand" class="eyebrow">Collectif Tartine Sauvage</p>
    <h1>Croûte que Croûte</h1>
  </div>
  <div class="block">
    <div id="menuStats" class="stats" hidden>
      <p id="menuBestBox" class="stat"><span class="stat-label">Record</span><span id="menuBest" class="stat-value digits"></span></p>
      <p id="menuRankBox" class="stat"><span class="stat-label">Place</span><span id="menuRank" class="stat-value hot"></span></p>
    </div>
    <p id="menuInfo" class="info" hidden></p>
    <form id="joinForm" class="join" hidden>
      <label for="pseudo" class="sr-only">Ton pseudo</label>
      <input id="pseudo" name="pseudo" maxlength="16" placeholder="Ton pseudo" autocomplete="nickname" autocapitalize="off" spellcheck="false" required>
      <p id="joinError" class="note error" hidden></p>
      <button class="cta" type="submit">C'est parti</button>
    </form>
    <div id="menuActions" class="actions">
      <button id="play" class="cta" type="button">Jouer</button>
      <button id="menuBoard" class="ghost" type="button" hidden>Classement</button>
    </div>
    <p id="menuCountdown" class="countdown" hidden></p>
    <a id="adminLink" class="admin-link" href="/admin" hidden>Admin</a>
  </div>
</section>

<section id="over" class="screen veil" hidden>
  <div class="block">
    <h2>Tartinée&nbsp;!</h2>
    <p class="score"><span id="final" class="digits">0,00</span><small>s</small></p>
    <p id="newBest" class="badge" hidden>Nouveau record</p>
    <div id="overStats" class="stats" hidden>
      <p id="overBestBox" class="stat"><span class="stat-label">Record</span><span id="overBest" class="stat-value digits"></span></p>
      <p id="overRankBox" class="stat"><span class="stat-label">Place</span><span id="overRank" class="stat-value hot"></span></p>
    </div>
    <p id="overNote" class="note" hidden></p>
  </div>
  <div class="actions">
    <button id="again" class="cta" type="button">Rejouer</button>
    <button id="overBoard" class="ghost" type="button" hidden>Classement</button>
  </div>
</section>

<section id="board" class="screen board" hidden>
  <div class="board-head">
    <h2>Classement</h2>
    <div id="boardTabs" class="board-tabs" role="tablist" hidden>
      <button type="button" role="tab" data-scope="event" aria-selected="true">Soirée</button>
      <button type="button" role="tab" data-scope="general" aria-selected="false">Général</button>
    </div>
    <p id="boardEvent" class="eyebrow"></p>
    <p id="boardCountdown" class="countdown" hidden></p>
  </div>
  <ol id="boardList" class="board-list"></ol>
  <p id="boardEmpty" class="note" hidden></p>
  <button id="boardBack" class="cta" type="button">Retour</button>
</section>

<section id="info" class="screen info-screen" hidden>
  <div class="board-head">
    <h2>Infos du jeu</h2>
    <div id="infoTabs" class="board-tabs" role="tablist">
      <button type="button" role="tab" data-tab="attacks" aria-selected="true">Attaques</button>
      <button type="button" role="tab" data-tab="weapons" aria-selected="false">Armes</button>
    </div>
  </div>
  <div id="infoBody" class="catalog info-scroll"></div>
  <button id="infoBack" class="cta" type="button">Retour</button>
</section>

<button id="infoBtn" class="corner info-btn" type="button" aria-label="Infos du jeu" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="7" r="1.8" fill="currentColor"/>
    <path d="M12 11v7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
  </svg>
</button>

<button id="music" class="corner left toggle" type="button" aria-label="Musique" aria-pressed="true" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M9 17.5V6.3l10-2.3v11.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="6.6" cy="17.5" r="2.6" fill="currentColor"/>
    <circle cx="16.6" cy="15.5" r="2.6" fill="currentColor"/>
    <path class="off halo" d="M4 4l16 16" stroke-width="5.5" stroke-linecap="round"/>
    <path class="off" d="M4 4l16 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
</button>

<button id="sfx" class="corner toggle" type="button" aria-label="Sons" aria-pressed="true" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
    <path class="on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path class="off" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
</button>

<script type="module" src="/js/app/main.js"></script>
</body>
</html>
