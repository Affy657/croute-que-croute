<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0b24">
<title>Croûte que Croûte | Écran géant</title>
<script src="/js/errors.js"></script>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<link rel="stylesheet" href="/ecran.css">
</head>
<body>
<main class="wall">
  <section class="board">
    <header class="head">
      <h1>Croûte que Croûte</h1>
      <p id="title" class="title">Classement</p>
      <p id="countdown" class="countdown" hidden></p>
    </header>
    <ol id="list" class="list"></ol>
    <p id="empty" class="empty" hidden>Aucun score pour l'instant</p>
  </section>
  <aside class="join">
    <img class="qr" src="/qr.svg" alt="QR code du jeu">
    <p class="scan">Scanne pour jouer</p>
    <p id="host" class="host"></p>
    <p id="players" class="players"></p>
    <ol id="feed" class="feed"></ol>
  </aside>
</main>
<div id="crown" class="crown" hidden>
  <p class="crown-label">Nouveau n°1</p>
  <p id="crownName" class="crown-name"></p>
  <p id="crownTime" class="crown-time"></p>
</div>
<button id="fullBtn" class="full" type="button">Plein écran</button>
<canvas id="party" aria-hidden="true"></canvas>
<script type="module" src="/js/ecran/ecran.js"></script>
</body>
</html>
